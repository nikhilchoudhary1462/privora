<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: #082f49;
      color: #38bdf8;
      border: 1px solid #0369a1;
      font-family: monospace;
    }
    .status-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      background: #06b6d4;
      color: #020617;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <strong style="color: #38bdf8; font-size: 14px;">Privora</strong>
    <span class="badge">ACTIVE SHIELD</span>
  </div>
  <div class="status-card">
    <div style="font-size: 11px; color: #94a3b8;">Real-Time Protection Status</div>
    <div style="font-size: 13px; font-weight: bold; color: #10b981; margin-top: 4px;">
      🟢 On-Device Interceptor Active
    </div>
    <div style="font-size: 11px; color: #64748b; margin-top: 6px;">
      Intercepting paste/drop events on all web pages. Zero cloud data transmission.
    </div>
  </div>
  <button class="btn" id="open-app-btn">Open Privora Vault Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
