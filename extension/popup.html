<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #F1F3F5;
      color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(156, 141, 212, 0.2);
      border: 1px solid rgba(156, 141, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 800;
      color: #212529;
      letter-spacing: -0.01em;
    }
    .badge {
      font-size: 9px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #ECFDF5;
      color: #047857;
      border: 1px solid #A7F3D0;
      font-family: monospace;
      font-weight: 700;
    }
    .status-card {
      background: #FAF9F6;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .status-title {
      font-size: 10px;
      color: #757575;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-active {
      font-size: 12px;
      font-weight: 700;
      color: #16A34A;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .features-list {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      color: #757575;
    }
    .feature-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feature-row span:last-child {
      font-weight: 600;
      color: #212529;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      background: #A99DD8;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 9px;
      font-weight: 700;
      cursor: pointer;
      font-size: 11px;
      transition: background 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .btn:hover {
      background: #8A7BC7;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">🛡️</div>
      <span class="brand-title">Privora Shield</span>
    </div>
    <span class="badge">ACTIVE</span>
  </div>

  <div class="status-card">
    <div class="status-title">Real-Time Protection Status</div>
    <div class="status-active">
      <span>●</span>
      <span>100% On-Device Interceptor</span>
    </div>
    <div class="features-list">
      <div class="feature-row" style="color: #6D5BA8; font-weight: 700;">
        <span>Seamless Auto-Shield</span>
        <span>Auto Encrypt/Decrypt</span>
      </div>
      <div class="feature-row">
        <span>File Upload Interception</span>
        <span>Enabled</span>
      </div>
      <div class="feature-row">
        <span>Clipboard PII Shield</span>
        <span>Enabled</span>
      </div>
      <div class="feature-row">
        <span>Auto-Retrace on Download</span>
        <span>Active</span>
      </div>
      <div class="feature-row">
        <span>Active Manifests</span>
        <span id="protected-count">0 Files</span>
      </div>
    </div>
  </div>
  <button class="btn" id="open-app-btn">Open Privora Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
